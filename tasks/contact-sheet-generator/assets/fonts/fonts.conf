<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Fontconfig for the contact-sheet Lambda. The AWS Lambda Node.js runtime ships
    with no fonts, so libvips (via Sharp) renders SVG <text> as .notdef boxes.
    We bundle Liberation Sans and point fontconfig here via FONTCONFIG_PATH.
  -->

  <!-- Scan the bundled font directory (where copyFiles places the .ttf files). -->
  <dir>/var/task/fonts</dir>

  <!-- /tmp is the only writable path in Lambda; fontconfig needs a writable cache. -->
  <cachedir>/tmp/fonts-cache</cachedir>

  <!-- Map the generic families to the bundled font so "sans-serif" resolves. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
