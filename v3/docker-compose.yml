# Local Postgres for `alchemy dev` (the `dev` origin in server/src/db.ts). Start with `docker compose up -d`.
# Pinned: the project name otherwise comes from the folder, and this keeps the existing blikka_postgres volume.
name: blikka
services:
  postgres:
    image: postgres:18 # 18+ for uuidv7(), the default for ids in server/src/db/model.ts
    ports:
      - "5433:5432" # 5432 is often taken by another local Postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blikka
    healthcheck: # lets `docker compose up --wait` (scripts/up.ts) wait until it accepts connections
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "blikka"]
      interval: 1s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql # 18+ keeps data in a versioned subfolder here, not in data/

volumes:
  postgres:
