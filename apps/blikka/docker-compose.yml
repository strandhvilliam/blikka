# Local Postgres for `alchemy dev` (the `dev` origin in src/api/db.ts). Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blikka
    healthcheck: # lets `docker compose up --wait` (scripts/up.ts) wait until it accepts connections
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "blikka"]
      interval: 1s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
